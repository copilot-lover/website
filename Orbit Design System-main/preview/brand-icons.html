<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="Lucide, 2px stroke line icons" viewport="700x215" --><html><head><meta charset="utf-8">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{font-family:'Geist Mono',monospace;background:#0A0E1A;padding:26px;}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;}
  .ic{aspect-ratio:1;border-radius:12px;background:#111829;border:1px solid rgba(248,250,252,0.08);display:grid;place-items:center;color:#94A3B8;}
  .lab{font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:#64748B;margin-bottom:16px;}
</style></head><body>
  <div class="lab">Lucide · 2px stroke · line</div>
  <div class="grid">
    <div class="ic"><i data-lucide="phone-call"></i></div>
    <div class="ic"><i data-lucide="phone-missed"></i></div>
    <div class="ic"><i data-lucide="message-square"></i></div>
    <div class="ic"><i data-lucide="layout-template"></i></div>
    <div class="ic"><i data-lucide="moon"></i></div>
    <div class="ic"><i data-lucide="mouse-pointer-click"></i></div>
    <div class="ic"><i data-lucide="rocket"></i></div>
    <div class="ic"><i data-lucide="trending-up"></i></div>
    <div class="ic"><i data-lucide="search"></i></div>
    <div class="ic"><i data-lucide="calendar-check"></i></div>
    <div class="ic"><i data-lucide="check"></i></div>
    <div class="ic"><i data-lucide="arrow-right"></i></div>
    <div class="ic"><i data-lucide="mail"></i></div>
    <div class="ic"><i data-lucide="radio"></i></div>
    <div class="ic"><i data-lucide="clock"></i></div>
    <div class="ic"><i data-lucide="zap"></i></div>
  </div>
  <script>lucide.createIcons({attrs:{width:22,height:22,'stroke-width':2}});</script>
</body></html>
