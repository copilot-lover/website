<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo & mark" subtitle="Wordmark lockup + planet mark variants" viewport="700x185" --><html><head><meta charset="utf-8">
<link href="../fonts/anthropic-serif.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{font-family:'Anthropic Serif Display',serif;background:#0A0E1A;padding:26px;display:flex;align-items:center;gap:40px;}
  .wm{display:flex;align-items:center;gap:11px;}
  .wm span{font-weight:500;font-size:32px;letter-spacing:-0.01em;color:#F8FAFC;}
  .lab{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#64748B;margin-bottom:12px;}
  .chip{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;}
</style></head><body>
  <div>
    <div class="lab">Lockup</div>
    <div class="wm"><img src="orbit-mark-white.png" style="width:38px;height:38px;"><span>Orbit</span></div>
  </div>
  <div style="width:1px;height:110px;background:rgba(248,250,252,0.08);"></div>
  <div>
    <div class="lab">Mark</div>
    <div style="display:flex;gap:14px;">
      <div class="chip" style="background:#0A0E1A;border:1px solid rgba(248,250,252,0.12);"><img src="orbit-mark-white.png" style="width:40px;"></div>
      <div class="chip" style="background:#111829;border:1px solid rgba(248,250,252,0.08);"><img src="orbit-mark-blue.png" style="width:40px;"></div>
      <div class="chip" style="background:#F8FAFC;"><img src="orbit-mark.png" style="width:40px;filter:brightness(0.1) saturate(0);"></div>
    </div>
  </div>
</body></html>
