<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Navy canvas · Orbit Blue · Signal Orange" viewport="700x196" --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{font-family:'Geist',sans-serif;background:#0A0E1A;padding:22px;}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .sw{border-radius:14px;padding:16px;height:150px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(248,250,252,0.08);}
  .name{font-weight:600;font-size:15px;letter-spacing:-0.01em;}
  .hex{font-family:'Geist Mono',monospace;font-size:12.5px;opacity:0.85;}
  .role{font-size:12px;opacity:0.7;font-family:'Geist Mono',monospace;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#0A0E1A;border-color:rgba(248,250,252,0.14);color:#F8FAFC;">
    <div class="role">Background</div>
    <div><div class="name">Orbit Navy</div><div class="hex">#0A0E1A</div></div>
  </div>
  <div class="sw" style="background:#3B82F6;color:#fff;">
    <div class="role">Primary accent</div>
    <div><div class="name">Orbit Blue</div><div class="hex">#3B82F6</div></div>
  </div>
  <div class="sw" style="background:#F97316;color:#fff;">
    <div class="role">Secondary accent</div>
    <div><div class="name">Signal Orange</div><div class="hex">#F97316</div></div>
  </div>
</div>
</body></html>
