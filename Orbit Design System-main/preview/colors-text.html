<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Text colors" subtitle="Off-white headings, slate body, captions on navy" viewport="700x190" --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{font-family:'Geist',sans-serif;background:#0A0E1A;padding:26px;}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .line{display:flex;align-items:baseline;gap:16px;}
  .lbl{font-family:'Geist Mono',monospace;font-size:11px;color:#64748B;width:96px;flex:none;}
  .hex{font-family:'Geist Mono',monospace;font-size:12px;color:#64748B;margin-left:auto;}
</style></head><body>
<div class="stack">
  <div class="line"><span class="lbl">fg-1</span><span style="color:#F8FAFC;font-size:24px;font-weight:700;letter-spacing:-0.03em;">Never miss another call.</span><span class="hex">#F8FAFC</span></div>
  <div class="line"><span class="lbl">fg-2</span><span style="color:#94A3B8;font-size:17px;">Body copy in muted slate for comfortable reading.</span><span class="hex">#94A3B8</span></div>
  <div class="line"><span class="lbl">fg-3</span><span style="color:#64748B;font-size:14px;">Captions, footnotes, and metadata.</span><span class="hex">#64748B</span></div>
  <div class="line"><span class="lbl">blue-400</span><span style="color:#60A5FA;font-size:14px;font-family:'Geist Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;">EYEBROW LABEL</span><span class="hex">#60A5FA</span></div>
</div>
</body></html>
