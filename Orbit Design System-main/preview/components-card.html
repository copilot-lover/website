<!DOCTYPE html>
<!-- @dsCard group="Components" name="Product card" subtitle="Dark card with blue-glow hover — the signature move" viewport="700x320" --><html><head><meta charset="utf-8">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link href="../fonts/anthropic-serif.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{font-family:'Geist',sans-serif;background:#0A0E1A;padding:24px;}
  .card{width:300px;padding:26px;border-radius:16px;background:#131B2D;border:1px solid rgba(59,130,246,0.45);box-shadow:0 0 0 1px rgba(59,130,246,0.20),0 18px 50px rgba(59,130,246,0.14);}
  .ico{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:rgba(59,130,246,0.16);border:1px solid rgba(59,130,246,0.28);color:#60A5FA;}
  .tag{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#64748B;padding:5px 10px;border-radius:999px;border:1px solid rgba(248,250,252,0.10);}
  .chk{display:flex;align-items:center;gap:10px;font-size:14.5px;color:#CBD5E1;}
  .chk svg{color:#3B82F6;}
</style></head><body>
  <div style="display:flex;gap:20px;align-items:flex-start;">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
        <div class="ico"><i data-lucide="phone-call" width="24" height="24"></i></div>
        <span class="tag">Voice</span>
      </div>
      <h3 style="font-family:'Anthropic Serif Text',serif;font-weight:600;font-size:23px;letter-spacing:-0.01em;color:#F8FAFC;margin:0 0 10px;">AI Voice Receptionist</h3>
      <p style="font-size:15.5px;line-height:1.6;color:#94A3B8;margin:0 0 20px;">Answers every call in your business's voice, qualifies the caller, and books the job — 24/7.</p>
      <div style="display:flex;flex-direction:column;gap:11px;padding-top:20px;border-top:1px solid rgba(248,250,252,0.07);">
        <div class="chk"><i data-lucide="check" width="16" height="16"></i>Answers on the first ring</div>
        <div class="chk"><i data-lucide="check" width="16" height="16"></i>Books &amp; reschedules jobs</div>
        <div class="chk"><i data-lucide="check" width="16" height="16"></i>Texts you a call summary</div>
      </div>
    </div>
    <div style="font-family:'Geist Mono',monospace;font-size:11px;color:#64748B;line-height:1.8;padding-top:8px;">
      card · #131B2D<br>radius 16<br>border blue .45<br>hover: lift + glow
    </div>
  </div>
  <script>lucide.createIcons({attrs:{'stroke-width':2}});</script>
</body></html>
