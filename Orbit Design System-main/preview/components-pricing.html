<!DOCTYPE html>
<!-- @dsCard group="Components" name="Pricing tiers" subtitle="Monthly retainer cards; Pro highlighted" viewport="700x280" --><html><head><meta charset="utf-8">
<link href="../fonts/anthropic-serif.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{font-family:'Geist',sans-serif;background:#0A0E1A;padding:24px;display:flex;gap:16px;}
  .card{flex:1;padding:22px;border-radius:16px;background:#111829;border:1px solid rgba(248,250,252,0.08);position:relative;}
  .pop{background:#131B2D;border-color:rgba(59,130,246,0.5);box-shadow:0 0 0 1px rgba(59,130,246,0.22),0 22px 60px rgba(59,130,246,0.16);}
  .badge{position:absolute;top:-11px;left:22px;padding:4px 11px;border-radius:999px;background:#3B82F6;color:#fff;font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;}
  .nm{font-size:15px;font-weight:600;color:#F8FAFC;}
  .bl{font-size:13px;color:#94A3B8;margin-top:5px;min-height:34px;}
  .pr{font-family:'Anthropic Serif Display',serif;font-size:44px;font-weight:500;color:#F8FAFC;letter-spacing:-0.01em;}
  .mo{font-size:14px;color:#64748B;}
  .setup{font-family:'Geist Mono',monospace;font-size:12px;color:#64748B;margin-top:4px;}
  .cta{margin-top:18px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:600;font-size:14px;}
</style></head><body>
  <div class="card">
    <div class="nm">Growth</div><div class="bl">Chat assistant + a site built to convert.</div>
    <div style="display:flex;align-items:baseline;gap:4px;margin-top:12px;"><span class="pr">$197</span><span class="mo">/mo</span></div>
    <div class="setup">+ $599 one-time setup</div>
    <div class="cta" style="background:rgba(248,250,252,0.04);color:#F8FAFC;border:1px solid rgba(248,250,252,0.12);">Get started</div>
  </div>
  <div class="card pop">
    <span class="badge">Most popular</span>
    <div class="nm">Pro</div><div class="bl">The full stack — calls, chat &amp; web.</div>
    <div style="display:flex;align-items:baseline;gap:4px;margin-top:12px;"><span class="pr">$297</span><span class="mo">/mo</span></div>
    <div class="setup">+ $999 one-time setup</div>
    <div class="cta" style="background:#F97316;color:#fff;box-shadow:0 6px 18px rgba(249,115,22,0.28);">Get a Free Demo</div>
  </div>
</body></html>
