<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation & glow" subtitle="Soft dark shadows + blue/orange attention glows" viewport="700x205" --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;}
  body{font-family:'Geist Mono',monospace;background:#0A0E1A;padding:30px;display:flex;gap:26px;align-items:center;justify-content:center;}
  .tile{width:104px;height:104px;border-radius:16px;background:#111829;border:1px solid rgba(248,250,252,0.08);}
  .lab{color:#64748B;font-size:10.5px;margin-top:14px;text-align:center;}
</style></head><body>
  <div><div class="tile" style="box-shadow:0 8px 24px rgba(0,0,0,0.45);"></div><div class="lab">md<br>black .45</div></div>
  <div><div class="tile" style="box-shadow:0 24px 64px rgba(0,0,0,0.55);"></div><div class="lab">lg<br>black .55</div></div>
  <div><div class="tile" style="box-shadow:0 12px 40px rgba(59,130,246,0.30);border-color:rgba(59,130,246,0.4);"></div><div class="lab">glow-blue</div></div>
  <div><div class="tile" style="box-shadow:0 12px 32px rgba(249,115,22,0.34);border-color:rgba(249,115,22,0.4);"></div><div class="lab">glow-orange</div></div>
</body></html>
