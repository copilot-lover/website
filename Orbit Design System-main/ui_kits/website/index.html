<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit — Never miss another customer call</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="../../fonts/anthropic-serif.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0A0E1A; }
  body {
    font-family: 'Geist', sans-serif;
    color: #94A3B8;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: rgba(59,130,246,0.30); color: #F8FAFC; }
  a { -webkit-tap-highlight-color: transparent; }
  /* faint star field — very subtle, premium not gimmicky */
  .starfield {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(248,250,252,0.35), transparent),
      radial-gradient(1px 1px at 70% 18%, rgba(248,250,252,0.25), transparent),
      radial-gradient(1px 1px at 85% 60%, rgba(248,250,252,0.22), transparent),
      radial-gradient(1px 1px at 40% 75%, rgba(248,250,252,0.20), transparent),
      radial-gradient(1px 1px at 12% 65%, rgba(248,250,252,0.18), transparent);
  }
  #root { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="starfield"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="NavHero.jsx"></script>

<script type="text/babel" src="Pricing.jsx"></script>
<script type="text/babel" src="Closing.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <React.Fragment>
        <Nav />
        <main>
          <Hero />
          <Problem />
          <WhatWeBuild />
          <HowItWorks />
          <Pricing />
          <FinalCTA />
        </main>
        <Footer />

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
